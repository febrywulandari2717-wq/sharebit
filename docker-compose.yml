# ShareBite — Docker Compose
#   docker compose up -d --build        lalu buka http://localhost:8080
# Konfigurasi lewat file .env (salin dari .env.docker.example). Semua nilai punya default untuk pengembangan.
name: sharebite

x-service-keys: &service-keys
  REQUEST_SERVICE_KEY: ${REQUEST_SERVICE_KEY:-request-secret-key-2026}
  DONATION_SERVICE_KEY: ${DONATION_SERVICE_KEY:-donation-secret-key-2026}

services:
  # ---- membuat pasangan kunci JWT RS256 sekali saja (disimpan di volume jwt_keys) ----
  keygen:
    image: node:20-alpine
    command: ["node", "/scripts/generate-keys.js"]
    environment:
      KEYS_DIR: /keys
    volumes:
      - ./scripts:/scripts:ro
      - jwt_keys:/keys
    restart: "no"

  # ---- database: satu server, tiga database, satu user per service ----
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-password}
      FOOD_DB_PASSWORD: ${FOOD_DB_PASSWORD:-food-dev-password}
      REQUEST_DB_PASSWORD: ${REQUEST_DB_PASSWORD:-request-dev-password}
      DONATION_DB_PASSWORD: ${DONATION_DB_PASSWORD:-donation-dev-password}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3307}:3306"   # opsional: akses dari host (mis. HeidiSQL). 3307 agar tidak bentrok dengan XAMPP
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- Python / Flask ----
  food-service:
    build: ./services/food-service
    restart: unless-stopped
    environment:
      <<: *service-keys
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: sharebite_food
      DB_USER: sharebite_food
      DB_PASSWORD: ${FOOD_DB_PASSWORD:-food-dev-password}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: sharebite-identity
      JWT_AUDIENCE: sharebite-api
      UPLOAD_DIR: /app/uploads
      DONATION_SERVICE_URL: http://donation-service:8003
    volumes:
      - jwt_keys:/keys:ro
      - food_uploads:/app/uploads
    depends_on:
      mysql: { condition: service_healthy }
      keygen: { condition: service_completed_successfully }
    ports:
      - "${FOOD_PORT:-5001}:5001"

  # ---- Node.js / Express ----
  request-service:
    build: ./services/request-service
    restart: unless-stopped
    environment:
      <<: *service-keys
      PORT: "5002"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: sharebite_request
      DB_USER: sharebite_request
      DB_PASSWORD: ${REQUEST_DB_PASSWORD:-request-dev-password}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: sharebite-identity
      JWT_AUDIENCE: sharebite-api
      FOOD_SERVICE_URL: http://food-service:5001
      DONATION_SERVICE_URL: http://donation-service:8003
    volumes:
      - jwt_keys:/keys:ro
    depends_on:
      mysql: { condition: service_healthy }
      keygen: { condition: service_completed_successfully }
      food-service: { condition: service_healthy }
    ports:
      - "${REQUEST_PORT:-5002}:5002"

  # ---- PHP / Laravel (identity, donasi, notifikasi, moderasi) ----
  donation-service:
    build: ./services/donation-service
    restart: unless-stopped
    environment: &laravel-env
      <<: *service-keys
      APP_NAME: ShareBite
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-base64:ZGV2LW9ubHktc2hhcmViaXRlLWtleS0zMmJ5dGVzISE=}
      APP_URL: http://localhost:8003
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: sharebite_donation
      DB_USERNAME: sharebite_donation
      DB_PASSWORD: ${DONATION_DB_PASSWORD:-donation-dev-password}
      DB_TIMEZONE: "+00:00"
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      JWT_PRIVATE_KEY_PATH: /keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: sharebite-identity
      JWT_AUDIENCE: sharebite-api
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_TTL: "604800"
      REQUEST_SERVICE_URL: http://request-service:5002
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sharebite.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
      RUN_MIGRATIONS: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - jwt_keys:/keys:ro
    depends_on:
      mysql: { condition: service_healthy }
      keygen: { condition: service_completed_successfully }
    ports:
      - "${DONATION_PORT:-8003}:8003"

  # ---- penjadwal Laravel: pengingat pengambilan tiap jam ----
  donation-scheduler:
    build: ./services/donation-service
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true
    volumes:
      - jwt_keys:/keys:ro
    depends_on:
      donation-service: { condition: service_healthy }

  # ---- website statis + gateway nginx ----
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    depends_on:
      food-service: { condition: service_healthy }
      request-service: { condition: service_healthy }
      donation-service: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
  food_uploads:
  jwt_keys:
