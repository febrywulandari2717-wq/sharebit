# Gateway + web statis. Browser hanya berbicara ke satu origin (port 8080), sehingga tidak ada masalah CORS.
#   /            -> website statis
#   /food/       -> Food Service     (Flask)    food-service:5001
#   /request/    -> Request Service  (Express)  request-service:5002
#   /identity/   -> Donation/Identity Service (Laravel) donation-service:8003
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health { default_type text/plain; return 200 "ok\n"; }

    location ^~ /food/ {
        proxy_pass http://food-service:5001/;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /request/ {
        proxy_pass http://request-service:5002/;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /identity/ {
        proxy_pass http://donation-service:8003/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ { expires 5m; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
