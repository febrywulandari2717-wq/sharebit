<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Admin · ShareBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">

<h2 class="mb-3">Dashboard admin</h2>
<div class="row g-3 mb-4" id="stats"></div>
<ul class="nav nav-tabs mb-3" id="tabs">
  <li class="nav-item"><button class="nav-link active" data-tab="users">Pengguna</button></li>
  <li class="nav-item"><button class="nav-link" data-tab="foods">Makanan</button></li>
  <li class="nav-item"><button class="nav-link" data-tab="reqs">Permintaan</button></li>
  <li class="nav-item"><button class="nav-link" data-tab="dons">Donasi</button></li></ul>
<div id="tab-users"><div class="row g-2 mb-3"><div class="col-md-4"><input id="uq" class="form-control" placeholder="Cari nama / email"></div>
  <div class="col-md-3"><select id="urole" class="form-select"><option value="">Semua peran</option><option value="donor">Donor</option><option value="recipient">Penerima</option><option value="admin">Admin</option></select></div></div>
  <div id="users"></div><div id="usersPager"></div></div>
<div id="tab-foods" class="d-none"><div id="foods"></div><div id="foodsPager"></div></div>
<div id="tab-reqs" class="d-none"><div id="reqs"></div><div id="reqsPager"></div></div>
<div id="tab-dons" class="d-none"><div id="dons"></div><div id="donsPager"></div></div>
</main>
<footer><div class="container d-flex justify-content-between flex-wrap"><span>ShareBite · berbagi makanan, kurangi pemborosan.</span><span>Tugas Cloud Computing</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
