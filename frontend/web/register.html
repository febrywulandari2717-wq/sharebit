<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ShareBite — platform berbagi makanan berlebih yang masih layak dikonsumsi.">
<title>Daftar · ShareBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-layout="public" data-title="Daftar">
<div id="view">

<div style="max-width:560px;margin:1rem auto"><div class="card pad" style="padding:2rem"><h1 style="font-size:2rem">Buat akun</h1><p class="muted">Pilih peran Anda di ShareBite.</p><div id="alert" role="alert"></div>
<form id="f" novalidate>
<div class="field"><label for="role">Saya ingin</label><select id="role" name="role" class="input"><option value="recipient">Mencari makanan (Penerima)</option><option value="donor">Membagikan makanan (Donatur)</option></select></div>
<div class="field"><label for="name">Nama lengkap</label><input id="name" name="name" class="input" required minlength="3"></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" class="input" required autocomplete="username"></div>
<div class="grid g2"><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" class="input" required minlength="8" autocomplete="new-password"><div class="hint">Minimal 8 karakter, ada huruf dan angka.</div></div>
<div class="field"><label for="password_confirmation">Ulangi password</label><input id="password_confirmation" name="password_confirmation" type="password" class="input" required autocomplete="new-password"></div></div>
<div class="field"><label for="phone">No. telepon (opsional)</label><input id="phone" name="phone" class="input" inputmode="numeric" placeholder="08xxxxxxxxxx"></div>
<div class="field"><label for="address">Alamat (opsional)</label><input id="address" name="address" class="input"></div>
<label class="check field"><input type="checkbox" id="agree" required><span>Saya menyetujui <a href="terms.html" target="_blank" rel="noopener">kebijakan privasi &amp; ketentuan</a>.</span></label>
<button class="btn btn-primary btn-block" type="submit">Daftar</button></form>
<p class="center" style="margin:1rem 0 0">Sudah punya akun? <a href="login.html">Masuk</a></p></div></div>
</div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/shell.js"></script>
<script>if(!window.__sbHalt)document.write('<script src="js/pages/auth.js"><\/script>')</script>
</body>
</html>
