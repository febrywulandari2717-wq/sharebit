<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Donor · ShareBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"><h2 class="mb-0">Dashboard donor</h2>
<button class="btn btn-terra" id="addFood">+ Bagikan makanan</button></div>
<div class="row g-3 mb-4" id="stats"></div>
<ul class="nav nav-tabs mb-3" id="tabs"><li class="nav-item"><button class="nav-link active" data-tab="foods">Makanan saya</button></li><li class="nav-item"><button class="nav-link" data-tab="reqs">Permintaan masuk</button></li></ul>
<div id="tab-foods"><div id="foods"></div><div id="foodsPager"></div></div>
<div id="tab-reqs" class="d-none">
  <div class="mb-3 col-md-3"><select id="reqStatus" class="form-select"><option value="">Semua status</option><option value="pending">Menunggu</option><option value="approved">Disetujui</option><option value="scheduled">Dijadwalkan</option><option value="completed">Selesai</option><option value="rejected">Ditolak</option><option value="cancelled">Dibatalkan</option><option value="expired">Kedaluwarsa</option></select></div>
  <div id="reqs"></div><div id="reqsPager"></div></div>

<div class="modal fade" id="foodModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
<form id="foodForm" novalidate>
<div class="modal-header"><h5 class="modal-title" id="foodTitle">Bagikan makanan</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><div class="row g-3">
  <div class="col-md-8"><label class="form-label">Nama makanan</label><input name="title" class="form-control" required></div>
  <div class="col-md-4"><label class="form-label">Kategori</label><select name="category_id" class="form-select" required></select></div>
  <div class="col-12"><label class="form-label">Deskripsi</label><textarea name="description" rows="2" class="form-control"></textarea></div>
  <div class="col-md-4"><label class="form-label">Jumlah</label><input name="quantity_total" type="number" min="1" max="1000" class="form-control" required></div>
  <div class="col-md-4"><label class="form-label">Satuan</label><input name="unit" class="form-control" value="porsi"></div>
  <div class="col-md-4"><label class="form-label">Maks. per permintaan</label><input name="max_per_request" type="number" min="1" class="form-control" placeholder="tanpa batas"></div>
  <div class="col-12"><label class="form-label">Lokasi pengambilan</label><input name="pickup_location" class="form-control" required></div>
  <div class="col-md-4"><label class="form-label">Mulai diambil</label><input name="pickup_start" type="datetime-local" class="form-control" required></div>
  <div class="col-md-4"><label class="form-label">Selesai diambil</label><input name="pickup_end" type="datetime-local" class="form-control" required></div>
  <div class="col-md-4"><label class="form-label">Batas konsumsi</label><input name="expires_at" type="datetime-local" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label">Alergen (opsional)</label><input name="allergens" class="form-control" placeholder="mis. kacang, udang"></div>
  <div class="col-md-6"><label class="form-label">Cara penyimpanan (opsional)</label><input name="storage_info" class="form-control"></div>
  <div class="col-12"><label class="form-label">Foto (JPG/PNG/WebP, maks 2 MB)</label><input name="image" type="file" accept="image/jpeg,image/png,image/webp" class="form-control"></div>
</div></div>
<div class="modal-footer"><button type="button" class="btn btn-outline-green" data-bs-dismiss="modal">Batal</button><button class="btn btn-terra" type="submit">Simpan</button></div>
</form></div></div></div>

<div class="modal fade" id="schedModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="schedForm" novalidate>
<div class="modal-header"><h5 class="modal-title">Jadwalkan pengambilan</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
  <div class="mb-3"><label class="form-label">Waktu pengambilan</label><input name="pickup_time" type="datetime-local" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Lokasi</label><input name="pickup_location" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Catatan untuk penerima</label><textarea name="instructions" rows="2" class="form-control"></textarea></div>
</div>
<div class="modal-footer"><button type="button" class="btn btn-outline-green" data-bs-dismiss="modal">Batal</button><button class="btn btn-terra" type="submit">Jadwalkan</button></div>
</form></div></div></div>
</main>
<footer><div class="container d-flex justify-content-between flex-wrap"><span>ShareBite · berbagi makanan, kurangi pemborosan.</span><span>Tugas Cloud Computing</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script src="js/donor.js"></script>
</body>
</html>
