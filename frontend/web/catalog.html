<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog · ShareBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">

<div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3"><div><h2 class="mb-0">Katalog makanan</h2><p class="text-muted mb-0">Makanan yang masih tersedia untuk diambil.</p></div></div>
<form id="filters" class="card-sb p-3 mb-4 row g-2 align-items-end">
  <div class="col-md-5"><label class="form-label small mb-1">Cari</label><input id="q" class="form-control" placeholder="Nama, deskripsi, atau lokasi"></div>
  <div class="col-md-3"><label class="form-label small mb-1">Kategori</label><select id="cat" class="form-select"><option value="">Semua</option></select></div>
  <div class="col-md-2"><label class="form-label small mb-1">Urutkan</label><select id="sort" class="form-select"><option value="newest">Terbaru</option><option value="expires_soon">Segera kedaluwarsa</option></select></div>
  <div class="col-md-2 d-grid"><button class="btn btn-green" type="submit">Cari</button></div>
</form>
<div id="list"></div><div id="pager"></div>
</main>
<footer><div class="container d-flex justify-content-between flex-wrap"><span>ShareBite · berbagi makanan, kurangi pemborosan.</span><span>Tugas Cloud Computing</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
