<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · ShareBite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">

<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card-sb p-4 p-md-5">
<h2 class="mb-1">Selamat datang kembali</h2><p class="text-muted">Masuk untuk melanjutkan.</p>
<div id="alert"></div>
<form id="f" novalidate>
  <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required autocomplete="username"></div>
  <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required autocomplete="current-password"></div>
  <button class="btn btn-terra w-100" type="submit">Masuk</button>
</form>
<p class="mt-3 mb-0 text-center">Belum punya akun? <a href="register.html">Daftar</a></p>
</div></div></div>
</main>
<footer><div class="container d-flex justify-content-between flex-wrap"><span>ShareBite · berbagi makanan, kurangi pemborosan.</span><span>Tugas Cloud Computing</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
