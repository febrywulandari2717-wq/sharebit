name: sharebite
services:
  keygen:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: ["node", "scripts/generate-keys.js"]
    restart: "no"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sharebite_dev_root}
    ports:
      - "3306:3306"
    volumes:
      - sharebite_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  food-service:
    build: ./services/food-service
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      FLASK_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sharebite_dev_root}
      DB_NAME: sharebite_food
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: sharebite-identity
      JWT_AUDIENCE: sharebite-api
      REQUEST_SERVICE_KEY: ${REQUEST_SERVICE_KEY:-request-secret-key-2026}
      DONATION_SERVICE_URL: http://donation-service:8003
      DONATION_SERVICE_KEY: ${DONATION_SERVICE_KEY:-donation-secret-key-2026}
      UPLOAD_DIR: /app/uploads
    ports:
      - "5001:5001"
    volumes:
      - ./keys:/keys:ro
      - sharebite_food_uploads:/app/uploads
    depends_on:
      keygen: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
    restart: unless-stopped

  request-service:
    build: ./services/request-service
    environment:
      HOST: 0.0.0.0
      PORT: 5002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sharebite_dev_root}
      DB_NAME: sharebite_request
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: sharebite-identity
      JWT_AUDIENCE: sharebite-api
      REQUEST_SERVICE_KEY: ${REQUEST_SERVICE_KEY:-request-secret-key-2026}
      DONATION_SERVICE_KEY: ${DONATION_SERVICE_KEY:-donation-secret-key-2026}
      FOOD_SERVICE_URL: http://food-service:5001
      DONATION_SERVICE_URL: http://donation-service:8003
      HTTP_TIMEOUT_MS: 10000
      RECONCILE_INTERVAL_SECONDS: 60
    ports:
      - "5002:5002"
    volumes:
      - ./keys:/keys:ro
    depends_on:
      keygen: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
      food-service: { condition: service_started }
      donation-service: { condition: service_started }
    restart: unless-stopped

  donation-service:
    build: ./services/donation-service
    environment:
      APP_NAME: ShareBite
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8003
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sharebite_donation
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sharebite_dev_root}
      DB_TIMEZONE: +00:00
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      JWT_PRIVATE_KEY_PATH: /keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: sharebite-identity
      JWT_AUDIENCE: sharebite-api
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
      DONATION_SERVICE_KEY: ${DONATION_SERVICE_KEY:-donation-secret-key-2026}
      REQUEST_SERVICE_URL: http://request-service:5002
      REQUEST_SERVICE_KEY: ${REQUEST_SERVICE_KEY:-request-secret-key-2026}
    ports:
      - "8003:8003"
    volumes:
      - ./keys:/keys:ro
      - sharebite_laravel_storage:/var/www/html/storage
    depends_on:
      keygen: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/web:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - food-service
      - request-service
      - donation-service
    restart: unless-stopped

volumes:
  sharebite_mysql_data:
  sharebite_food_uploads:
  sharebite_laravel_storage:
